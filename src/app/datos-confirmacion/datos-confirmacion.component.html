<div class="layout">

  <main class="ContenidoConfirmacion">

  <div *ngIf="enviando" class="LogoConfirmacion">
    <p>Enviando solicitud...</p>
  </div>

  <div *ngIf="enviado && !error">
    <div class="LogoConfirmacion">
      <img src="assets/Logos/IconoCheck.svg" alt="logo huds">
    </div>

    <h1 class="TextoPrincipal">Solicitud enviada con éxito</h1>

    <div class="TextoIntro">
      <p>Recordá que toda la información necesaria<br> 
        será enviada a tu correo electrónico <br>{{ solicitudService.solicitante.email || 'nombre......@correo.com' }}
      </p>
    </div>

    <div class="BotonConfirmacion">
        <button class="boton-descarga" type="button">DESCARGAR COMPROBANTE</button>
    </div>
  </div>

  <div *ngIf="error" style="text-align: center; padding: 2rem;">
    <h2 style="color: #E00713;">Error al enviar la solicitud</h2>
    <p>{{ error }}</p>
    <button class="boton-descarga" type="button" (click)="enviar()">REINTENTAR</button>
  </div>

  </main>

</div>
